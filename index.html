<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>世界一難しい迷路 — hard-maze-maker</title>
<style>
  :root{
    --bg:#0b1021; --panel:#141a30; --ink:#e2e8f0; --muted:#8ea0c4;
    --wall:#e2e8f0; --start:#22c55e; --goal:#ef4444; --player:#facc15;
    --trail:#38bdf8; --accent:#a78bfa; --line:#26304f;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{
    background:var(--bg); color:var(--ink);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Hiragino Kaku Gothic ProN",Meiryo,sans-serif;
    display:flex; flex-direction:column; align-items:center;
    padding:16px; gap:14px; min-height:100%;
  }
  h1{font-size:1.15rem; margin:0; letter-spacing:.02em; text-align:center}
  h1 small{display:block; color:var(--muted); font-weight:400; font-size:.72rem; margin-top:4px}
  .wrap{width:100%; max-width:640px; display:flex; flex-direction:column; gap:12px}
  .bar{
    display:flex; flex-wrap:wrap; gap:8px; align-items:center; justify-content:center;
    background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:10px;
  }
  .bar label{font-size:.78rem; color:var(--muted); display:flex; flex-direction:column; gap:3px; align-items:flex-start}
  select,button{
    font:inherit; font-size:.82rem; color:var(--ink); background:#1d2542;
    border:1px solid var(--line); border-radius:8px; padding:7px 11px; cursor:pointer;
  }
  button.primary{background:var(--accent); color:#151033; border-color:transparent; font-weight:600}
  button:active{transform:translateY(1px)}
  .stats{display:flex; gap:8px; flex-wrap:wrap; justify-content:center}
  .chip{
    background:var(--panel); border:1px solid var(--line); border-radius:10px;
    padding:8px 12px; font-variant-numeric:tabular-nums; min-width:74px; text-align:center;
  }
  .chip b{display:block; font-size:1.05rem}
  .chip span{font-size:.66rem; color:var(--muted); text-transform:uppercase; letter-spacing:.06em}
  .board{
    background:var(--panel); border:1px solid var(--line); border-radius:14px;
    padding:10px; display:flex; justify-content:center; touch-action:none;
  }
  canvas{width:100%; height:auto; image-rendering:auto; border-radius:6px}
  .pad{display:grid; grid-template-columns:repeat(3,64px); grid-template-rows:repeat(3,64px);
       gap:8px; justify-content:center; margin-top:2px}
  .pad button{font-size:1.3rem; border-radius:12px; height:100%; background:#1d2542}
  .pad .empty{visibility:hidden}
  .msg{min-height:1.4em; text-align:center; font-size:.9rem; color:var(--accent); font-weight:600}
  footer{color:var(--muted); font-size:.72rem; text-align:center; line-height:1.6; max-width:560px}
  kbd{background:#1d2542; border:1px solid var(--line); border-bottom-width:2px; border-radius:5px;
      padding:1px 6px; font-size:.72rem}
  @media (max-width:420px){ .pad{grid-template-columns:repeat(3,56px); grid-template-rows:repeat(3,56px)} }

  /* ---- 印刷レイアウト (用紙サイズは指定せずブラウザ任せ。問題/解答の2ページ) ---- */
  #printArea{display:none}
  @media print{
    :root{color-scheme:light}
    @page{ margin:10mm; }               /* サイズ指定なし=プリンタ既定の用紙に合わせる */
    body{background:#fff; color:#000; padding:0; display:block}
    body > .wrap, body > h1{display:none !important}
    #printArea{display:block}
    .sheet{ page-break-after:always; break-after:page; text-align:center; }
    .sheet:last-child{ page-break-after:auto; break-after:auto }
    .sheet svg{ display:block; width:auto; height:auto; max-width:100%; max-height:96vh; margin:0 auto; }
  }
</style>
</head>
<body>
  <!-- 印刷/PDF 用。画面では非表示、印刷時のみ表示される -->
  <div id="printArea"></div>

  <h1>世界一難しい迷路
    <small>壁伝い法も行き止まり潰しも効かない — ループ入り・最長解の意地悪迷路</small>
  </h1>

  <div class="wrap">
    <div class="bar">
      <label>サイズ
        <select id="size">
          <option value="15">15 × 22</option>
          <option value="21">21 × 31</option>
          <option value="31" selected>31 × 46</option>
          <option value="41">41 × 61 (鬼)</option>
          <option value="51">51 × 76 (地獄)</option>
          <option value="61">61 × 91 (発狂)</option>
          <option value="81">81 × 121 (無理)</option>
          <option value="101">101 × 151 (絶望)</option>
          <option value="131">131 × 196 (終焉)</option>
          <option value="151">151 × 226 (虚無)</option>
          <option value="201">201 × 301 (無間)</option>
        </select>
      </label>
      <label>意地悪さ
        <select id="braid">
          <option value="0" selected>0 — 完全迷路(最長経路・おすすめ)</option>
          <option value="0.35">中 — ループ入り</option>
          <option value="0.6">高 — ループ多め</option>
          <option value="0.85">極 — 罠だらけ</option>
        </select>
      </label>
      <label>選抜数
        <select id="cand">
          <option value="1">1</option>
          <option value="30" selected>30 から最難選抜</option>
          <option value="80">80 から最難選抜</option>
        </select>
      </label>
      <button id="regen" class="primary">新しい迷路</button>
      <button id="hint">ヒント (解を表示)</button>
      <button id="print" class="primary">🖨 印刷 / PDF</button>
      <button id="pngview">PNG表示</button>
      <button id="svgview">SVG表示</button>
      <button id="svg">SVG保存</button>
      <button id="png">PNG保存</button>
    </div>

    <div class="stats">
      <div class="chip"><b id="stTime">0.0s</b><span>time</span></div>
      <div class="chip"><b id="stSteps">0</b><span>steps</span></div>
      <div class="chip"><b id="stSol">–</b><span>最短解</span></div>
      <div class="chip"><b id="stLoops">–</b><span>ループ</span></div>
      <div class="chip"><b id="stTrap">–</b><span>最長の罠</span></div>
      <div class="chip"><b id="stScore">–</b><span>難易度</span></div>
    </div>

    <div class="board"><canvas id="cv" width="600" height="600"></canvas></div>
    <div class="msg" id="msg">S(緑)から G(赤)へ。矢印キー / WASD / スワイプで移動。</div>

    <div class="pad">
      <div class="empty"></div>
      <button data-dir="N">▲</button>
      <div class="empty"></div>
      <button data-dir="W">◀</button>
      <div class="empty"></div>
      <button data-dir="E">▶</button>
      <div class="empty"></div>
      <button data-dir="S">▼</button>
      <div class="empty"></div>
    </div>

    <footer>
      recursive backtracker で長い蛇行通路を掘り、行き止まりを繋いで<b>ループ</b>を作成。
      グラフ<b>直径の両端</b>を入口・出口に置いて解を最長化し、複数候補から
      難易度スコア最大の一枚を選抜しています。ループがあるため
      <b>右手法(壁伝い)は無限ループに陥り</b>、行き止まり潰しも通用しません。
    </footer>
  </div>

<script>
"use strict";
// ---- 迷路生成 (maze.py の設計を JS へ移植) --------------------------------
const N=1,S=2,E=4,W=8, OPP={1:2,2:1,4:8,8:4}, DELTA={1:[0,-1],2:[0,1],4:[1,0],8:[-1,0]};

function makeMaze(width,height,rng,braid){
  const walls=Array.from({length:height},()=>new Array(width).fill(15));
  const idx=(x,y)=>y*width+x;
  const inb=(x,y)=>x>=0&&x<width&&y>=0&&y<height;
  const carve=(x,y,d)=>{const[dx,dy]=DELTA[d],nx=x+dx,ny=y+dy;if(!inb(nx,ny))return;
    walls[y][x]&=~d; walls[ny][nx]&=~OPP[d];};
  const linked=(x,y,d)=>!(walls[y][x]&d);
  const neigh=(x,y)=>{const r=[];for(const d in DELTA){if(linked(x,y,+d)){
    const[dx,dy]=DELTA[d],nx=x+dx,ny=y+dy;if(inb(nx,ny))r.push([nx,ny]);}}return r;};

  // recursive backtracker
  let sx=(rng()*width)|0, sy=(rng()*height)|0;
  const stack=[[sx,sy]], seen=new Uint8Array(width*height); seen[idx(sx,sy)]=1;
  while(stack.length){
    const[x,y]=stack[stack.length-1], opts=[];
    for(const d in DELTA){const[dx,dy]=DELTA[d],nx=x+dx,ny=y+dy;
      if(inb(nx,ny)&&!seen[idx(nx,ny)])opts.push([+d,nx,ny]);}
    if(!opts.length){stack.pop();continue;}
    const[d,nx,ny]=opts[(rng()*opts.length)|0];
    carve(x,y,d); seen[idx(nx,ny)]=1; stack.push([nx,ny]);
  }

  // braid: 行き止まりをループ化
  if(braid>0){
    const ends=[];
    for(let y=0;y<height;y++)for(let x=0;x<width;x++)
      if(neigh(x,y).length===1)ends.push([x,y]);
    for(let i=ends.length-1;i>0;i--){const j=(rng()*(i+1))|0;[ends[i],ends[j]]=[ends[j],ends[i]];}
    for(const[x,y]of ends){
      if(neigh(x,y).length!==1)continue;
      if(rng()>braid)continue;
      const blocked=[];
      for(const d in DELTA){const[dx,dy]=DELTA[d],nx=x+dx,ny=y+dy;
        if(inb(nx,ny)&&linked(x,y,+d)===false)blocked.push([neigh(nx,ny).length,+d]);}
      if(blocked.length){blocked.sort((a,b)=>b[0]-a[0]); carve(x,y,blocked[0][1]);}
    }
  }
  return {width,height,walls,neigh,linked};
}

function bfs(m,src){
  const dist=new Map(), key=(x,y)=>x+","+y, q=[src]; dist.set(key(...src),0);
  let head=0;
  while(head<q.length){const[x,y]=q[head++];
    for(const[nx,ny]of m.neigh(x,y)){const k=key(nx,ny);
      if(!dist.has(k)){dist.set(k,dist.get(key(x,y))+1);q.push([nx,ny]);}}}
  return {dist,key};
}
function farthest(m,src){
  const{dist,key}=bfs(m,src); let best=src,bd=-1;
  for(const[k,d]of dist)if(d>bd){bd=d;best=k.split(",").map(Number);}
  return[best,bd];
}
function solvePath(m,start,goal){
  const prev=new Map(), key=(x,y)=>x+","+y, q=[start]; prev.set(key(...start),null);
  let head=0;
  while(head<q.length){const[x,y]=q[head++]; if(x===goal[0]&&y===goal[1])break;
    for(const[nx,ny]of m.neigh(x,y)){const k=key(nx,ny);
      if(!prev.has(k)){prev.set(k,[x,y]);q.push([nx,ny]);}}}
  const path=[goal]; let cur=goal;
  while(prev.get(key(...cur))){cur=prev.get(key(...cur));path.push(cur);}
  path.reverse(); return path;
}

function buildHardest(width,height,braid,candidates,seed){
  const master=mulberry32(seed);
  let best=null,bestMeta=null;
  for(let i=0;i<candidates;i++){
    const rng=mulberry32((master()*2**32)>>>0);
    const m=makeMaze(width,height,rng,braid);
    const[a]=farthest(m,[0,0]);
    const[start]=farthest(m,a);
    const[goal]=farthest(m,start);
    const path=solvePath(m,start,goal);
    // loops = edges - cells + 1
    let edges=0,cells=width*height,decisions=0;
    for(let y=0;y<height;y++)for(let x=0;x<width;x++){
      const deg=m.neigh(x,y).length; edges+=deg; if(deg>=3)decisions++;}
    edges/=2; const loops=edges-cells+1;

    // --- 局所: 曲がりの密度と直線の長さ ---
    let turns=0, run=1, maxRun=1;
    for(let i=1;i<path.length-1;i++){
      const[ax,ay]=path[i-1],[bx,by]=path[i],[cx,cy]=path[i+1];
      if(bx-ax!==cx-bx||by-ay!==cy-by){turns++; run=1;}
      else {run++; if(run>maxRun)maxRun=run;}
    }
    const tort=turns/Math.max(1,path.length-1);         // 曲がり密度(高いほど複雑)

    // --- 大局: 解経路の空間的な広がり(回転半径) ---
    let mx=0,my=0;
    for(const[x,y]of path){mx+=x; my+=y;}
    mx/=path.length; my/=path.length;
    let rg2=0;
    for(const[x,y]of path){rg2+=(x-mx)*(x-mx)+(y-my)*(y-my);}
    const rg=Math.sqrt(rg2/path.length);
    const spread=rg/Math.sqrt(width*width+height*height); // 0..~0.4(大きいほど紙面全体を動く)

    // --- 深い騙し: 正解経路から分岐する行き止まりの深さ ---
    // 正解経路を始点にした多点BFSで各セルの「経路からの深さ」を求める。
    // 行き止まり(次数1)の深さ = そこまで探索して無駄になる罠の長さ。
    const kk=(x,y)=>y*width+x;
    const dep=new Int32Array(width*height).fill(-1);
    const bq=new Int32Array(width*height); let bh=0,bt=0;
    for(const[x,y]of path){const i=kk(x,y); if(dep[i]<0){dep[i]=0; bq[bt++]=i;}}
    while(bh<bt){
      const i=bq[bh++], x=i%width, y=(i/width)|0, d=dep[i];
      for(const[nx,ny]of m.neigh(x,y)){const j=kk(nx,ny);
        if(dep[j]<0){dep[j]=d+1; bq[bt++]=j;}}
    }
    const tips=[];
    for(let y=0;y<height;y++)for(let x=0;x<width;x++){
      if((x===start[0]&&y===start[1])||(x===goal[0]&&y===goal[1]))continue;
      if(m.neigh(x,y).length===1){const d=dep[kk(x,y)]; if(d>0)tips.push(d);}
    }
    tips.sort((a,b)=>b-a);
    const maxTrap=tips.length?tips[0]:0;                 // 最長の罠(一撃の絶望)
    const trapTop=tips.slice(0,4).reduce((a,b)=>a+b,0);  // 長い罠 上位4本(何度も無駄骨)

    const score=
        path.length                     // 長い解ほど良い
      + decisions*0.4
      + loops*0.3                        // ループは控えめ(近道を作り解を縮めるため)
      + spread*path.length*3.0           // 大局: 紙面を大きく動く
      + tort*path.length*1.5             // 局所: 単純でない(よく曲がる)
      - maxRun*2.0                       // 局所: 長い直線(単純な動き)を減点
      + maxTrap*1.5                      // 深い騙し: 最長の無駄探索
      + trapTop*0.8;                     // 深い騙し: 長い罠が何本もある
    if(!bestMeta||score>bestMeta.score){
      best=m; bestMeta={start,goal,path,loops,spread:Math.round(spread*1000)/1000,
        maxRun,tort:Math.round(tort*1000)/1000,maxTrap,trapTop,
        score:Math.round(score*10)/10,sol:path.length};
    }
  }
  return{m:best,...bestMeta};
}

// 決定論的 PRNG
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;
  let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;
  return((t^t>>>14)>>>0)/4294967296;};}

// ---- 状態 ----------------------------------------------------------------
const cv=document.getElementById("cv"), ctx=cv.getContext("2d");
let game=null, cell=0, pad=0;

function newGame(){
  const width=+document.getElementById("size").value;
  const height=Math.floor(width*1.5);       // アスペクト比 1.5 の縦長迷路
  const braid=+document.getElementById("braid").value;
  const candidates=+document.getElementById("cand").value;
  const seed=(Math.random()*2**32)>>>0;
  // 大きい迷路は候補数を自動で抑えて生成時間を約2秒以内に収める
  const cap=Math.max(6, Math.floor(360000/(width*height)));
  const eff=Math.min(candidates, cap);
  const build=()=>{
    const g=buildHardest(width,height,braid,eff,seed);
    game={...g, width, height, player:[...g.start], steps:0, t0:null,
          trail:new Set([g.start.join(",")]), showHint:false, done:false, raf:null};
    document.getElementById("stSol").textContent=g.sol;
    document.getElementById("stLoops").textContent=g.loops;
    document.getElementById("stTrap").textContent=g.maxTrap;
    document.getElementById("stScore").textContent=g.score;
    document.getElementById("stSteps").textContent="0";
    document.getElementById("stTime").textContent="0.0s";
    document.getElementById("msg").textContent="S(緑)から G(赤)へ。矢印 / WASD / スワイプ。";
    layout(); draw(); tick();
  };
  // 大きい迷路は生成に時間がかかるので「生成中…」を先に描画してから作る
  if(width>=61){
    const note=eff<candidates?`（候補${eff}から選抜）`:"";
    document.getElementById("msg").textContent=`${width}×${height} を生成中… 🌀${note}`;
    setTimeout(build,20);
  }else build();
}

function layout(){
  const availW=Math.min(560, Math.floor((document.querySelector(".board").clientWidth-20)));
  if(availW<=0)return;                     // 盤面が非表示(印刷中など)のときは触らない
  const g=game;
  cell=(availW-2)/g.width;                 // 正方形セル
  cv.width=availW;
  cv.height=Math.round(cell*g.height+2);   // 迷路の縦横比(1.5)に合わせた縦長キャンバス
  pad=1;
}

// 壁を連続した線に結合して返す(グリッド単位)。短い線分を繋ぐことで
// 端キャップが通路にはみ出す「余分な壁」アーティファクトを防ぐ。
function wallRuns(g){
  const w=g.width, h=g.height, wa=g.m.walls, H=[], V=[];
  // 水平の壁: 各グリッド線 gy (0..h) を横に走査して連続を結合
  for(let gy=0;gy<=h;gy++){
    let run=null;
    for(let x=0;x<w;x++){
      const on = gy<h ? (wa[gy][x]&N) : (wa[h-1][x]&S);
      if(on){ if(run===null)run=x; }
      else if(run!==null){ H.push([run,gy,x]); run=null; }
    }
    if(run!==null)H.push([run,gy,w]);
  }
  // 垂直の壁: 各グリッド線 gx (0..w) を縦に走査して連続を結合
  for(let gx=0;gx<=w;gx++){
    let run=null;
    for(let y=0;y<h;y++){
      const on = gx<w ? (wa[y][gx]&W) : (wa[y][w-1]&E);
      if(on){ if(run===null)run=y; }
      else if(run!==null){ V.push([gx,run,y]); run=null; }
    }
    if(run!==null)V.push([gx,run,h]);
  }
  return {H,V};
}

function draw(){
  const g=game, w=g.width, h=g.height;
  if(!g||cell<=0)return;                 // 盤面が非表示(印刷中など)のときは描かない
  ctx.fillStyle=getVar("--panel"); ctx.fillRect(0,0,cv.width,cv.height);
  // ヒント経路
  if(g.showHint){
    ctx.strokeStyle=getVar("--trail"); ctx.globalAlpha=.5;
    ctx.lineWidth=cell*.34; ctx.lineJoin="round"; ctx.lineCap="round";
    ctx.beginPath();
    g.path.forEach(([x,y],i)=>{const cx=pad+x*cell+cell/2,cy=pad+y*cell+cell/2;
      i?ctx.lineTo(cx,cy):ctx.moveTo(cx,cy);}); ctx.stroke(); ctx.globalAlpha=1;
  }
  // 足跡
  ctx.fillStyle="rgba(250,204,21,.16)";
  for(const k of g.trail){const[x,y]=k.split(",").map(Number);
    ctx.fillRect(pad+x*cell+cell*.2,pad+y*cell+cell*.2,cell*.6,cell*.6);}
  // start/goal
  mark(g.start,getVar("--start")); mark(g.goal,getVar("--goal"));
  // 壁 (連続線に結合してから描画。丸キャップ/接合で角もきれい)
  const {H,V}=wallRuns(g);
  ctx.strokeStyle=getVar("--wall"); ctx.lineWidth=Math.max(1.4,cell*.11);
  ctx.lineCap="round"; ctx.lineJoin="round";
  ctx.beginPath();
  for(const[x0,gy,x1]of H){ctx.moveTo(pad+x0*cell,pad+gy*cell);ctx.lineTo(pad+x1*cell,pad+gy*cell);}
  for(const[gx,y0,y1]of V){ctx.moveTo(pad+gx*cell,pad+y0*cell);ctx.lineTo(pad+gx*cell,pad+y1*cell);}
  ctx.stroke();
  // player
  const[px,py]=g.player;
  ctx.fillStyle=getVar("--player");
  ctx.beginPath();
  ctx.arc(pad+px*cell+cell/2,pad+py*cell+cell/2,cell*.32,0,7); ctx.fill();
}
function mark([x,y],color){ctx.fillStyle=color;
  ctx.beginPath();ctx.arc(pad+x*cell+cell/2,pad+y*cell+cell/2,cell*.3,0,7);ctx.fill();}
function getVar(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}

function move(d){
  const g=game; if(!g||g.done)return;
  const[x,y]=g.player;
  if(g.m.linked(x,y,d)){
    const[dx,dy]=DELTA[d]; g.player=[x+dx,y+dy];
    if(g.t0===null)g.t0=performance.now();
    g.steps++; g.trail.add(g.player.join(","));
    document.getElementById("stSteps").textContent=g.steps;
    if(g.player[0]===g.goal[0]&&g.player[1]===g.goal[1])win();
    draw();
  }
}
function win(){
  const g=game; g.done=true;
  const t=((performance.now()-g.t0)/1000).toFixed(1);
  const eff=Math.round(g.sol/g.steps*100);
  document.getElementById("msg").innerHTML=
    `🎉 ゴール！ ${t}s / ${g.steps}歩 (最短${g.sol}歩・効率${eff}%) — 難易度 ${g.score}`;
}
function tick(){
  const g=game; if(!g)return;
  if(g.t0!==null&&!g.done)
    document.getElementById("stTime").textContent=((performance.now()-g.t0)/1000).toFixed(1)+"s";
  g.raf=requestAnimationFrame(tick);
}

// ---- 書き出し ------------------------------------------------------------
// 迷路の SVG(白地・黒壁)。用紙サイズは指定せず、迷路の内容ぴったりの px viewBox
// にする(レイアウトはブラウザ任せ)。迷路グリッドは長方形(w≠h)に対応。
function svgGeom(){
  const c=18, M=Math.round(c*1.2), headH=Math.round(c*2.6), footH=Math.round(c*1.8);
  const w=game.width, h=game.height;
  return {c,M,headH,footH, ox:M, oy:M+headH, W:w*c+M*2, H:h*c+M*2+headH+footH};
}
function mazeSVG(withPath){
  const g=game, w=g.width, h=g.height;
  const {c,headH,footH,ox,oy,W,H}=svgGeom();
  const wallW=Math.max(1.6, c*0.13);
  const title=withPath?"解答":"世界一難しい迷路";
  const nf=v=>Math.round(v*100)/100;
  const L=[
    `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${W} ${H}" width="${W}" height="${H}">`,
    `<rect width="${W}" height="${H}" fill="#ffffff"/>`,
    `<text x="${W/2}" y="${nf(headH*0.55)+18}" font-family="sans-serif" font-size="${c}" font-weight="700" fill="#111" text-anchor="middle">${title}</text>`,
    `<text x="${W/2}" y="${nf(headH*0.9)+18}" font-family="sans-serif" font-size="${nf(c*0.55)}" fill="#555" text-anchor="middle">サイズ ${w}×${h} ・ 最短解 ${g.sol}歩 ・ 難易度 ${g.score}</text>`];
  if(withPath){
    const pts=g.path.map(([x,y])=>`${nf(ox+x*c+c/2)},${nf(oy+y*c+c/2)}`).join(" ");
    L.push(`<polyline points="${pts}" fill="none" stroke="#dd1111" stroke-width="${nf(c*0.32)}" stroke-linejoin="round" stroke-linecap="round" opacity="0.85"/>`);
  }
  const runs=wallRuns(g);
  for(const[x0,gy,x1]of runs.H)
    L.push(`<line x1="${nf(ox+x0*c)}" y1="${nf(oy+gy*c)}" x2="${nf(ox+x1*c)}" y2="${nf(oy+gy*c)}" stroke="#111" stroke-width="${nf(wallW)}" stroke-linecap="round"/>`);
  for(const[gx,y0,y1]of runs.V)
    L.push(`<line x1="${nf(ox+gx*c)}" y1="${nf(oy+y0*c)}" x2="${nf(ox+gx*c)}" y2="${nf(oy+y1*c)}" stroke="#111" stroke-width="${nf(wallW)}" stroke-linecap="round"/>`);
  for(const[[cx,cy],ch]of[[g.start,"S"],[g.goal,"G"]]){
    const mx=ox+cx*c+c/2, my=oy+cy*c+c/2, r=c*0.42;
    L.push(`<circle cx="${nf(mx)}" cy="${nf(my)}" r="${nf(r)}" fill="#fff" stroke="#111" stroke-width="${nf(Math.max(1.4,wallW))}"/>`);
    L.push(`<text x="${nf(mx)}" y="${nf(my)}" font-family="sans-serif" font-size="${nf(c*0.72)}" font-weight="700" fill="#111" text-anchor="middle" dominant-baseline="central">${ch}</text>`);
  }
  if(!withPath)
    L.push(`<text x="${W/2}" y="${nf(oy+h*c+footH*0.7)}" font-family="sans-serif" font-size="${nf(c*0.6)}" fill="#555" text-anchor="middle">S から G まで一筆で。壁伝い法は通じません。</text>`);
  L.push("</svg>");
  return L.join("\n");
}
function download(blob,name){
  const url=URL.createObjectURL(blob), a=document.createElement("a");
  a.href=url; a.download=name; a.click();
  setTimeout(()=>URL.revokeObjectURL(url),1000);
}
function fname(ext){return `maze-${game.width}x${game.height}-score${game.score}.${ext}`;}

// SVG(文字列)を返す。SVG保存/表示で使用
function currentSVG(){ return mazeSVG(game.showHint); }

// SVG を白地の PNG にラスタライズして blob を返す(用紙サイズ指定なし)
function renderPNGBlob(cb){
  const svg=currentSVG(), {W,H}=svgGeom();
  const scale=Math.min(2, 2600/Math.max(W,H));  // 長辺 ~2600px 目安、小さい迷路は2倍まで
  const img=new Image();
  img.onload=()=>{
    const cn=document.createElement("canvas");
    cn.width=Math.round(W*scale); cn.height=Math.round(H*scale);
    const cx=cn.getContext("2d");
    cx.fillStyle="#ffffff"; cx.fillRect(0,0,cn.width,cn.height);
    cx.drawImage(img,0,0,cn.width,cn.height);
    cn.toBlob(cb,"image/png");
  };
  img.src="data:image/svg+xml;charset=utf-8,"+encodeURIComponent(svg);
}
function exportPNG(){ renderPNGBlob(b=>download(b,fname("png"))); }
function exportSVG(){ download(new Blob([currentSVG()],{type:"image/svg+xml"}),fname("svg")); }

// 画像だけを別タブに表示(保存はブラウザの標準機能でどうぞ)
function viewPNG(){
  const w=window.open("","_blank");  // ユーザー操作中に開く(ポップアップブロック回避)
  renderPNGBlob(b=>{
    const url=URL.createObjectURL(b);
    if(w && !w.closed) w.location.href=url;  // ブラウザ標準の画像ビューアで表示
    else download(b,fname("png"));           // ブロック時はダウンロードにフォールバック
  });
}
function viewSVG(){
  const blob=new Blob([currentSVG()],{type:"image/svg+xml"});
  const url=URL.createObjectURL(blob), w=window.open(url,"_blank");
  if(!w) download(blob,fname("svg"));        // ブロック時はダウンロードにフォールバック
}

// 印刷用に「問題ページ」と「解答ページ」を組み立てる(用紙サイズはブラウザ任せ)
function buildPrint(){
  if(!game)return;
  document.getElementById("printArea").innerHTML=
    `<section class="sheet">${mazeSVG(false)}</section>`
   +`<section class="sheet">${mazeSVG(true)}</section>`;
}

// ---- 入力 ----------------------------------------------------------------
const KEYMAP={ArrowUp:N,ArrowDown:S,ArrowRight:E,ArrowLeft:W,
  w:N,s:S,d:E,a:W,W:N,S:S,D:E,A:W,k:N,j:S,l:E,h:W};
addEventListener("keydown",e=>{if(e.key in KEYMAP){e.preventDefault();move(KEYMAP[e.key]);}});
document.querySelectorAll(".pad button").forEach(b=>
  b.addEventListener("click",()=>move({N,S,E,W}[b.dataset.dir])));
document.getElementById("regen").addEventListener("click",newGame);
document.getElementById("hint").addEventListener("click",()=>{
  if(!game)return; game.showHint=!game.showHint; draw();
  document.getElementById("msg").textContent=game.showHint?"最短解を表示中(ズル)":"がんばれ！";
});
["size","braid","cand"].forEach(id=>
  document.getElementById(id).addEventListener("change",newGame));
document.getElementById("svg").addEventListener("click",()=>{if(game)exportSVG();});
document.getElementById("svgview").addEventListener("click",()=>{if(game)viewSVG();});
document.getElementById("print").addEventListener("click",()=>{buildPrint(); window.print();});
addEventListener("beforeprint",buildPrint);
document.getElementById("png").addEventListener("click",()=>{if(game)exportPNG();});
document.getElementById("pngview").addEventListener("click",()=>{if(game)viewPNG();});

// スワイプ
let sx=0,sy=0;
cv.addEventListener("touchstart",e=>{const t=e.touches[0];sx=t.clientX;sy=t.clientY;},{passive:true});
cv.addEventListener("touchend",e=>{const t=e.changedTouches[0],dx=t.clientX-sx,dy=t.clientY-sy;
  if(Math.abs(dx)<18&&Math.abs(dy)<18)return;
  move(Math.abs(dx)>Math.abs(dy)?(dx>0?E:W):(dy>0?S:N));},{passive:true});
addEventListener("resize",()=>{if(game){layout();draw();}});

newGame();
